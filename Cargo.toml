[package]
name = "sloppy-toppy"
version = "0.1.0"
edition = "2021"
description = "A htop/btop-inspired system monitor that unnecessarily routes your vitals through a local LLM so it can roast you."

[[bin]]
name = "sloppy-toppy"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
sysinfo = "0.33"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
